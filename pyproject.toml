[project]
name = "imdb-project"
version = "1.0.0"
description = "ECE Paris - Big Data Processing (fall 2026): IMDb analytics with Spark and Kafka"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "D",   # pydocstyle (Google convention)
]
ignore = [
    "D105", # docstring in magic method
    "D107", # docstring in __init__ (documented at class level)
    "N812", # `from pyspark.sql import functions as F` is the PySpark convention
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"tests/factory.py" = ["D", "E501"] # table-like synthetic rows

[tool.ruff.lint.isort]
known-first-party = ["imdb_project"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
