# Spark logging for the project jobs: warnings and errors only on the console.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# Known noisy loggers.
logger.kafka_config.name = org.apache.kafka.clients.consumer.ConsumerConfig
logger.kafka_config.level = error
logger.kafka_admin_config.name = org.apache.kafka.clients.admin.AdminClientConfig
logger.kafka_admin_config.level = error
logger.native_loader.name = org.apache.hadoop.util.NativeCodeLoader
logger.native_loader.level = error
